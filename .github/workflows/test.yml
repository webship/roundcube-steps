name: Test

on:
  push:
    branches:
      - 2.0.x
  pull_request:
    branches:
      - 2.0.x
  workflow_dispatch:

permissions:
  contents: read

# The runs of a pull request share a group, so a newer push cancels the run
# it supersedes. Every other run (a push to 2.0.x, a run started by hand)
# gets a group of its own: it is never queued behind another run, and never
# cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  cucumber:
    # A real webmail, built in a DDEV project on the runner: the latest Roundcube from its releases with its database
    # made by its own bin/initdb.sh, a mail server of its own beside it (GreenMail) with the accounts of the suite, and
    # the test content, on two lanes:
    #   - php-8.3: PHP 8.3, then the assertions that must fail (tests/must-fail);
    #   - php-8.1: PHP 8.1, the oldest PHP Roundcube 1.7 runs on.
    name: roundcube-steps test suite (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: php-8.3
            php: '8.3'
            must_fail: true
          - lane: php-8.1
            php: '8.1'
            must_fail: false
    env:
      HEADLESS: 'true'
      FORCE_COLOR: '1'
      SITE_DIR: ${{ github.workspace }}/../roundcube-site
      PHP_VERSION: ${{ matrix.php }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the JSDoc examples and feature steps against the step regexes
        run: npm run test:examples

      - name: Check that a feature named on the command line runs alone
        run: npm run test:paths

      - name: Run cucumber-js dry-run (ambiguity / undefined step check)
        run: npx cucumber-js --dry-run

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          autostart: false

      - name: Build the test webmail (Roundcube, its mail server and accounts, the test content)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/build-ddev-site.sh

      - name: Check the site is the one cucumber.js runs against by default
        run: |
          DEFAULT_URL="$(LAUNCH_URL= node -e "console.log(require('./cucumber.js').default.worldParameters.launchUrl)")"
          echo "Built: $LAUNCH_URL, default: $DEFAULT_URL"
          test "${LAUNCH_URL%/}" = "$DEFAULT_URL"

      - name: Count what the webmail holds (a run must leave it as it found it)
        run: COUNTS_ONLY=1 .github/scripts/build-ddev-site.sh | tee "$RUNNER_TEMP/counts-built.txt"

      - name: Run the test suite
        run: npx cucumber-js

      - name: Check the run left the webmail as it found it (the mailboxes, folders, contacts, identities, responses)
        run: |
          COUNTS_ONLY=1 .github/scripts/build-ddev-site.sh > "$RUNNER_TEMP/counts-run-1.txt"
          diff -u "$RUNNER_TEMP/counts-built.txt" "$RUNNER_TEMP/counts-run-1.txt"

      - name: Run the test suite again (it leaves the site as it found it)
        run: npx cucumber-js

      - name: Check the second run left the webmail as it found it
        run: |
          COUNTS_ONLY=1 .github/scripts/build-ddev-site.sh > "$RUNNER_TEMP/counts-run-2.txt"
          diff -u "$RUNNER_TEMP/counts-built.txt" "$RUNNER_TEMP/counts-run-2.txt"

      - name: Run the assertions that must fail
        if: matrix.must_fail
        run: npm run test:must-fail

      - name: Show the log of the site's server
        if: failure()
        run: |
          cd "$SITE_DIR"
          ddev logs -s web --tail 300 < /dev/null || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report-${{ matrix.lane }}
          path: tests/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload failure screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.lane }}
          path: |
            screenshots/
            videos/
          retention-days: 14
          if-no-files-found: ignore
